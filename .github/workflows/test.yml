name: Sync Fork with Upstream

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight (optional)

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Checkout the forked repository
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper merging

      # Set up Git configuration
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Add the upstream repository
      - name: Add Upstream Remote
        run: |
          git remote add upstream https://${{ secrets.UPSTREAM_PAT }}@github.com/The-SEO-Hustler/static-pages-websites

      # Fetch the latest changes from upstream
      - name: Fetch Upstream Changes
        run: git fetch upstream
